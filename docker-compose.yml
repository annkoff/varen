# Self-hosted production: PostgreSQL + VAREN app + persistent file storage.
#   cp .env.example .env    # fill AUTH_SECRET, ADMIN_*, TELEGRAM_*, POSTGRES_PASSWORD, SITE_URL
#   docker compose up -d --build
#   docker compose --profile setup run --rm setup     # first run only: demo catalog + admin account
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: varen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: varen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varen -d varen"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://varen:${POSTGRES_PASSWORD}@db:5432/varen?schema=public
      DIRECT_URL: postgresql://varen:${POSTGRES_PASSWORD}@db:5432/varen?schema=public
      STORAGE_LOCAL_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  # One-off: migrations + seed (12 projects, reviews, referral links, admin from ADMIN_EMAIL/ADMIN_PASSWORD).
  setup:
    build:
      context: .
      target: builder
    profiles: ["setup"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://varen:${POSTGRES_PASSWORD}@db:5432/varen?schema=public
      DIRECT_URL: postgresql://varen:${POSTGRES_PASSWORD}@db:5432/varen?schema=public
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
